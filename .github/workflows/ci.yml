name: CI

# Correctness gates, cheapest first: the pure-logic unit suite, type-checking,
# then a real boot of the built app.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    name: Unit (pure logic)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22+: the suite runs the TypeScript sources directly via
      # --experimental-strip-types (see the `test` script).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Deliberately no `npm ci`: every module under test is dependency-free by
      # design (that's why the risky logic lives in src/lib and electron/lib), so
      # this gate needs nothing but a checkout and runs in seconds.
      - name: Unit tests
        run: npm test

  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        # sharp (pulled in by @xenova/transformers) downloads its libvips
        # binary at install time, and that download is flaky on CI runners.
        # Retry so a transient timeout doesn't fail the run.
        run: |
          for n in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $n); retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Type-check (web + node)
        run: npm run typecheck

  smoke:
    name: Smoke (Windows)
    # Pinned to windows-2022: node-gyp 9.4.1 (rebuilds node-pty from source)
    # can't locate Visual Studio on the Server 2025 image that windows-latest
    # now resolves to. 2022 is the known-good image. Keep in sync with the
    # release workflow; revisit if node-gyp is bumped to v10+.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # node-pty compiles from source via node-gyp; distutils was removed from
      # Python 3.12, so pin 3.11 (matches the release workflow).
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        # sharp (pulled in by @xenova/transformers) downloads its libvips
        # binary at install time, and that download is flaky on CI runners.
        # Retry so a transient timeout doesn't fail the run.
        run: |
          for n in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $n); retrying in 15s..."
            sleep 15
          done
          exit 1

      # Rebuild node-pty / better-sqlite3 against the Electron ABI so they load
      # when the smoke test launches the app (npm ci builds them for Node).
      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Build (renderer + main)
        run: npm run build

      - name: Smoke test (boot the app)
        run: npm run smoke

      # Drives a real pty: asserts output still arrives intact and in order,
      # and that it stays coalesced into frame-sized IPC batches.
      - name: PTY output test
        run: npm run pty-verify

      # The floating dictation widget: opens, drags, persists, and re-clamps a
      # position saved for a larger window. No microphone involved.
      - name: Voice widget test
        run: npm run voice-verify
